services:
  config-test:
    image: python:3.12-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    command: ["python3", "tools/verify_config.py"]

  firmware-build:
    image: devkitpro/devkitarm:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - homepad_3ds_artifacts:/artifacts
    command: ["sh", "tools/portainer-test.sh"]

volumes:
  homepad_3ds_artifacts:
